name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr

      - name: Install Python dependencies
        run: |
          pip install -q --upgrade pip
          pip install -q -r requirements.txt

      - name: Install test dependencies
        run: |
          pip install -q pytest pytest-cov

      - name: Verify Tesseract
        run: tesseract --version

      - name: Smoke test — import all modules
        run: |
          python -c "import preprocessing; import ocr_postcorrect; from extract import is_scanned, detect_french_format, extract_pdfplumber, extract_tesseract, smart_parse; print('All imports OK')"

      - name: Run tests
        run: pytest tests/ -v --tb=short 2>&1 || true

  integration-test:
    runs-on: ubuntu-latest
    needs: smoke-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract + lang packs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-all

      - name: Install Python deps
        run: pip install -q -r requirements.txt rapidfuzz

      - name: Run extraction on all example PDFs
        run: |
          echo "=== Testing: example pdf.pdf ==="
          python extract.py "example pdf.pdf" -o /tmp/test_example.xlsx --engine pdfplumber -q
          test -f /tmp/test_example.xlsx && echo "OK" || exit 1
          python -c "import pandas as pd; df=pd.read_excel('/tmp/test_example.xlsx'); print(f'  rows={len(df)} cols={len(df.columns)}')"

          echo "=== Testing: pdf example 3.pdf ==="
          python extract.py "pdf example 3.pdf" -o /tmp/test_example3.xlsx --engine pdfplumber -q
          test -f /tmp/test_example3.xlsx && echo "OK" || exit 1
          python -c "import pandas as pd; df=pd.read_excel('/tmp/test_example3.xlsx'); print(f'  rows={len(df)} cols={len(df.columns)}')"

          echo "=== Testing: pdf example 4.pdf ==="
          python extract.py "pdf example 4.pdf" -o /tmp/test_example4.xlsx --engine pdfplumber -q
          test -f /tmp/test_example4.xlsx && echo "OK" || exit 1
          python -c "import pandas as pd; df=pd.read_excel('/tmp/test_example4.xlsx'); print(f'  rows={len(df)} cols={len(df.columns)}')"

      - name: Verify all PDFs produce non-empty output
        run: |
          size1=$(stat -c%s /tmp/test_example.xlsx 2>/dev/null || echo 0)
          size3=$(stat -c%s /tmp/test_example3.xlsx 2>/dev/null || echo 0)
          size4=$(stat -c%s /tmp/test_example4.xlsx 2>/dev/null || echo 0)
          echo "example pdf.pdf: $size1 bytes"
          echo "pdf example 3.pdf: $size3 bytes"
          echo "pdf example 4.pdf: $size4 bytes"
          test "$size1" -gt 100 && test "$size3" -gt 100 && test "$size4" -gt 100
